redis:
  host: localhost
  port: 6379

qdrant:
  host: localhost
  port: 6333
  collection: triage_reports

neurallog:
  window_size: 20
  step_size: 1
  anomaly_threshold: 0.5
  bert_model: bert-base-uncased
  embedding_cache_dir: data/embeddings
  # Paper defaults for reference (Le & Zhang, ASE 2021):
  # nhead: 8, num_layers: 6
  # Reduced for development/synthetic training:
  nhead: 2
  num_layers: 2
  dim_feedforward: 512
  dropout: 0.1

embedding:
  report_model: all-MiniLM-L6-v2
  report_dim: 384

llm:
  # Ordered list of providers to try; first available + successful one wins.
  # 'ollama' is always forced to the end by the factory as the local safety net.
  chain:
    - groq
    - openrouter
    - opencode_go
    - ollama

  retry:
    retries_per_provider: 1    # extra attempts after the initial try
    timeout_seconds: 30        # per-invoke timeout enforced in the client adapter

  providers:
    groq:
      model: groq/compound-mini          # Groq's smallest purpose-built mini model
      temperature: 0.0
      # api_key: $GROQ_API_KEY (env)

    openrouter:
      model: meta-llama/llama-3.2-3b-instruct   # 3B params (paid, avoids :free rate limits)
      base_url: https://openrouter.ai/api/v1
      temperature: 0.0
      # api_key: $OPENROUTER_API_KEY (env)
      # Optional OpenRouter attribution headers (sent verbatim if non-empty):
      http_referer:
      x_title:

    opencode_go:
      model:                          # REQUIRED — fill from OpenCode Go subscription
      base_url:                       # REQUIRED — OpenAI-compatible /chat/completions endpoint
      temperature: 0.0
      # api_key: $OPENCODE_GO_API_KEY (env)

    ollama:
      model: gemma3:1b                # 1B params; pull with `ollama pull gemma3:1b`
      base_url: http://localhost:11434
      temperature: 0.0

api:
  # abuseipdb_key loaded from ABUSEIPDB_API_KEY env var
  # nvd_api_key loaded from NVD_API_KEY env var
  nvd_rate_limit_no_key: 5     # requests per 30 seconds
  nvd_rate_limit_with_key: 50

prefilter:
  critical_keywords:
    - CRITICAL
    - EMERGENCY
    - FATAL
  auth_fail_threshold: 5
  auth_fail_window_seconds: 60
  privilege_escalation_patterns:
    - "sudo.*COMMAND=/bin/bash"
    - "sudo.*COMMAND=/bin/sh"
    - "su.*authentication failure"

dashboard:
  fastapi_port: 8000
  nextjs_port: 3000
